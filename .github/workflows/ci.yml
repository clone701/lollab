name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    # 毎週月曜日 9:00 (JST) に脆弱性チェック
    - cron: '0 0 * * 1'
  # Actions タブの「Run workflow」から手動で実行する（main を選ぶとデプロイまで行う）
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm install @tailwindcss/oxide-linux-x64-gnu --no-save 2>/dev/null || true
      
      - name: Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Type check
        run: npm run type-check
      
      - name: Lint
        run: npm run lint
      
      - name: Format check
        run: npm run format-check
      
      - name: Test
        run: npm run test:ci
      
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://dummy.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy-key' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'dummy-secret-for-ci-build-only' }}
          NEXTAUTH_URL: 'http://localhost:3000'

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Format check (Black)
        run: black --check .
      
      - name: Import order check (isort)
        run: isort --check-only .
      
      - name: Lint (Flake8)
        run: flake8 .
      
      - name: Type check (mypy)
        run: mypy .
      
      - name: Security check (Bandit)
        run: bandit -r . -ll
      
      - name: Dependency audit (Safety)
        run: safety check --json || true
        continue-on-error: true

  deploy:
    name: Deploy (AWS CodeBuild)
    # main への push、または main を選んだ手動実行で、テストが成功したときだけ実行する
    # （PR・develop・定期実行では実行しない。AWS のロールも main からしか引き受けられない）
    needs: [frontend, backend]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 同時に1つだけ実行し、実行中のデプロイは中断しない
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run CodeBuild and wait for completion
        run: |
          set -euo pipefail
          build_id=$(aws codebuild start-build \
            --project-name lollab-deploy \
            --source-version "$GITHUB_SHA" \
            --query build.id --output text)
          echo "CodeBuild: $build_id"
          while true; do
            sleep 15
            read -r status phase <<< "$(aws codebuild batch-get-builds --ids "$build_id" \
              --query 'builds[0].[buildStatus,currentPhase]' --output text)"
            echo "status=$status phase=$phase"
            [ "$status" = "IN_PROGRESS" ] || break
          done
          if [ "$status" != "SUCCEEDED" ]; then
            echo "::error::CodeBuild が $status で終了しました（$build_id）。CloudWatch Logs の /aws/codebuild/lollab-deploy を確認してください"
            exit 1
          fi
